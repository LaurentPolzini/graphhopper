name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      # workflow pour analyser le score du module core
      - name: Run pitest on core module
        run: |
          mvn test-compile -pl core org.pitest:pitest-maven:mutationCoverage | tee core/core-score

          Core_Score=$(grep -A15 Statistics core/core-score | grep Killed | grep -oP '\(\K[0-9]+')
          echo "le score de mutation pour le module core est $Core_Score%" 

          if [ -f core/Prec_Score ]; then
            Prev_Score=$(cat core/Prec_Score)
          else
            Prev_Score=0
          fi

          if [ "$Core_Score" -lt "$Prev_Score" ]; then
            echo "Le score de mutation dans le module core a baisse $Prev_Score% ---> $Core_Score%"
            exit 1
          fi

          echo "$Core_Score" > core/Prec_Score

        # workflow pour analyser le score du module reader-gtfs
      - name: Run pitest on reader-gtfs module
        run: |
          mvn test-compile -pl reader-gtfs org.pitest:pitest-maven:mutationCoverage | tee reader-gtfs/reader-score

          Reader_Score=$(grep -A15 Statistics reader-gtfs/reader-score | grep Killed | grep -oP '\(\K[0-9]+')
          echo "le score de mutation pour le module reader-gtfs est $Reader_Score%"

          if [ -f reader-gtfs/Prec_Score_gtfs ]; then
            Prev_Score=$(cat reader-gtfs/Prec_Score_gtfs)
          else
            Prev_Score=0
          fi

          if [ "$Reader_Score" -lt "$Prev_Score" ]; then
            echo "Le score de mutation dans le module core a baisse $Prev_Score% ---> $Reader_Score%"
            exit 1
          fi

          echo "$Reader_Score" > reader-gtfs/Prec_Score_gtfs


